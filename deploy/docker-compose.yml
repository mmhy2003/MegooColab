name: megoocolab

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: megoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: megoo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U megoo"]
      interval: 3s
      timeout: 3s
      retries: 30

  # global search; its index can always be rebuilt from the database, so backups skip it
  meilisearch:
    image: getmeili/meilisearch:v1.55.0
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 3s
      timeout: 3s
      retries: 30

  # rate-limit counters (Plan 10): nothing worth keeping, so no volume and no persistence
  valkey:
    image: valkey/valkey:8.1.3
    restart: unless-stopped
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    build: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # started, not healthy: search being down must not keep MegooColab down (search answers "unavailable")
      meilisearch:
        condition: service_started
      # started, not healthy: with Valkey down the limits are off (requests are let through), not MegooColab
      valkey:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://megoo:${POSTGRES_PASSWORD}@db:5432/megoo
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /data/uploads
      # tests only: local fake embeddings instead of calling a provider
      AI_FAKE: ${AI_FAKE:-false}
      MEMORY_EXTRACT_DELAY_SECONDS: ${MEMORY_EXTRACT_DELAY_SECONDS:-60}
      MEMORY_DREAM_HOUR_UTC: ${MEMORY_DREAM_HOUR_UTC:-3}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      VALKEY_URL: valkey://valkey:6379/0
      # apart from the URL, so any characters work
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?set VALKEY_PASSWORD in .env}
      # a header a proxy in front sets with the visitor's address (e.g. CF-Connecting-IP); see docs/install.md
      CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
      RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-30}
      RATE_LIMIT_TOTP_PER_ACCOUNT: ${RATE_LIMIT_TOTP_PER_ACCOUNT:-5}
      RATE_LIMIT_FORGOT_PER_EMAIL: ${RATE_LIMIT_FORGOT_PER_EMAIL:-3}
      RATE_LIMIT_FORGOT_PER_IP: ${RATE_LIMIT_FORGOT_PER_IP:-10}
      RATE_LIMIT_TOKEN_PAGES_PER_IP: ${RATE_LIMIT_TOKEN_PAGES_PER_IP:-10}
      RATE_LIMIT_CHANGE_PASSWORD_PER_USER: ${RATE_LIMIT_CHANGE_PASSWORD_PER_USER:-5}
      RATE_LIMIT_API_PER_USER: ${RATE_LIMIT_API_PER_USER:-3000}
      RATE_LIMIT_API_PER_IP: ${RATE_LIMIT_API_PER_IP:-120}
      RATE_LIMIT_AI_PER_USER: ${RATE_LIMIT_AI_PER_USER:-30}
      RATE_LIMIT_WEBHOOK_PER_CONNECTION: ${RATE_LIMIT_WEBHOOK_PER_CONNECTION:-120}
      RATE_LIMIT_WS_CONNECT: ${RATE_LIMIT_WS_CONNECT:-30}
    volumes:
      - uploads:/data/uploads
    # a git host on this machine (self-hosted, or the e2e fake provider) is reachable as host.docker.internal
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      backend:
        condition: service_healthy  # the backend applies migrations on startup
    environment:
      DATABASE_URL: postgresql+asyncpg://megoo:${POSTGRES_PASSWORD}@db:5432/megoo
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      RUN_MIGRATIONS_ON_STARTUP: "false"
      AI_FAKE: ${AI_FAKE:-false}
      MEMORY_EXTRACT_DELAY_SECONDS: ${MEMORY_EXTRACT_DELAY_SECONDS:-60}
      MEMORY_DREAM_HOUR_UTC: ${MEMORY_DREAM_HOUR_UTC:-3}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
    extra_hosts: ["host.docker.internal:host-gateway"]

  frontend:
    build: ../frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  meilidata:
  uploads:
  caddy_data:
  caddy_config:
