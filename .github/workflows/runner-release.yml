name: Runner release

on:
  push:
    tags:
      - "runner-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      # GoReleaser's monorepo tag prefix is Pro only: hand it the plain version
      # (runner-v1.2.3 -> v1.2.3) and publish the archives under the real tag.
      - name: Version from tag
        run: echo "GORELEASER_CURRENT_TAG=v${GITHUB_REF_NAME#runner-v}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          workdir: runner
          args: release --clean --skip=publish,validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Runner ${GITHUB_REF_NAME#runner-v}" --generate-notes \
            runner/dist/*.tar.gz runner/dist/*.zip runner/dist/checksums.txt
