name: CI

on:
  push:
  pull_request:
  # the release workflow runs these first: nothing is published that they have not passed
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: megoo
          POSTGRES_PASSWORD: megoo
          POSTGRES_DB: megoo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U megoo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_MASTER_KEY: ci-meili-master-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
    env:
      MEILI_URL: http://localhost:7700
      # the dev stack's Valkey password (the backend's default); a test checks it is sent apart from the URL
      VALKEY_URL: valkey://localhost:6379/0
      MEILI_MASTER_KEY: ci-meili-master-key
      TEST_DATABASE_URL: postgresql+asyncpg://megoo:megoo@localhost:5433/megoo_test
      SECRET_KEY: ci-secret-key-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      # an exact version: setup-uv publishes no major tag (v10) any more
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # rate-limit counters, with a password like the dev and production stacks (a service container takes
      # no command, so it could not set one)
      - name: Start Valkey
        run: |
          docker run -d --name valkey -p 6379:6379 valkey/valkey:8.1.3 valkey-server --requirepass megoo-dev-valkey
          for i in $(seq 30); do docker exec valkey valkey-cli -a megoo-dev-valkey --no-auth-warning ping | grep -q PONG && exit 0; sleep 1; done
          exit 1
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      # The worktree tests run git and need a committer identity.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: go test ./...
      - run: go vet ./...

  # the release rules (tools/release/versions.py) and the version files agreeing with each other
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tools/release -q
      - run: python tools/release/versions.py check
