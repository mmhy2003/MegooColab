name: CI

on:
  push:
  pull_request:
  # the release workflow runs these first: nothing is published that they have not passed
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: megoo
          POSTGRES_PASSWORD: megoo
          POSTGRES_DB: megoo_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U megoo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      meilisearch:
        image: getmeili/meilisearch:v1.55.0
        env:
          MEILI_MASTER_KEY: ci-meili-master-key
          MEILI_NO_ANALYTICS: "true"
        ports:
          - 7700:7700
      # rate-limit counters; service containers take no command, so CI's Valkey has no password
      valkey:
        image: valkey/valkey:8.1.3
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      MEILI_URL: http://localhost:7700
      VALKEY_URL: valkey://localhost:6379/0
      # CI's Valkey has no password (service containers take no command); the default is the dev stack's
      VALKEY_PASSWORD: ""
      MEILI_MASTER_KEY: ci-meili-master-key
      TEST_DATABASE_URL: postgresql+asyncpg://megoo:megoo@localhost:5433/megoo_test
      SECRET_KEY: ci-secret-key-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  runner:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      # The worktree tests run git and need a committer identity.
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: go test ./...
      - run: go vet ./...

  # the release rules (tools/release/versions.py) and the version files agreeing with each other
  release-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest tools/release -q
      - run: python tools/release/versions.py check
